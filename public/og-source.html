<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image source — mzahran.tech</title>
    <!--
      Source template for public/og-image.jpg (1200x630).
      Regenerate: npm run build && npm run preview, open this page at the
      preview origin, wait for fonts, screenshot at exactly 1200x630, and
      save over public/og-image.jpg.
    -->
    <style>
      @font-face {
        font-family: "Amiamie";
        src: url("/fonts/amiamie/woff2/Amiamie-Black.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Amiamie";
        src: url("/fonts/amiamie/woff2/Amiamie-Light.woff2") format("woff2");
        font-weight: 300;
        font-style: normal;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #e5e5e0;
        color: #0c0c0b;
        font-family: "Amiamie", sans-serif;
        position: relative;
        padding: 72px 72px 56px;
      }
      .bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: #cfa355;
      }
      .glyph {
        position: absolute;
        top: 76px;
        right: 76px;
        width: 44px;
        height: 44px;
      }
      .name {
        font-weight: 900;
        font-size: 108px;
        line-height: 0.95;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .role {
        margin-top: 20px;
        font-weight: 300;
        font-size: 26px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.55);
      }
      .rule {
        margin-top: 48px;
        height: 1px;
        background: rgba(0, 0, 0, 0.25);
      }
      .bottom {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 56px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .line {
        font-weight: 300;
        font-size: 22px;
        color: rgba(0, 0, 0, 0.7);
      }
      .site {
        font-weight: 900;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <svg
      class="glyph"
      viewBox="0 0 24 24"
      fill="#cfa355"
      aria-hidden="true"
    >
      <path d="M12 0l2.6 9.4L24 12l-9.4 2.6L12 24l-2.6-9.4L0 12l9.4-2.6z" />
    </svg>
    <h1 class="name">Mohamed<br />Zahran</h1>
    <p class="role">Software Engineer · RICOH Europe</p>
    <div class="rule"></div>
    <div class="bottom">
      <p class="line">Six enterprise systems, end to end.</p>
      <p class="site">mzahran.tech</p>
    </div>
  </body>
</html>
